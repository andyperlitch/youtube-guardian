<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Channel Whitelist</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="wrap">
      <h1 class="title">Allowed channels</h1>
      <p class="hint">
        When this list is not empty, only these channels can play videos on YouTube. Paste a channel URL, <code>@handle</code>, or a channel ID (<code>UC…</code>) after unlocking.
      </p>

      <section id="lock-panel" class="lock-panel">
        <p class="lock-hint">Enter the password to add or remove channels.</p>
        <form id="unlock-form" class="unlock-row">
          <input
            id="password-input"
            type="password"
            placeholder="Password"
            autocomplete="off"
            spellcheck="false"
          />
          <button type="submit" id="unlock-btn">Unlock</button>
        </form>
        <p id="pw-error" class="error" hidden></p>
      </section>

      <form id="add-form" class="add-row" hidden>
        <input
          id="channel-input"
          type="text"
          placeholder="youtube.com/@channel or UC…"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="submit" id="add-btn">Add</button>
      </form>
      <p id="error" class="error" hidden></p>

      <ul id="list" class="list"></ul>
      <p id="empty" class="empty">No channels yet — all of YouTube is allowed.</p>
    </main>
    <script src="channel-utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
